name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check all modules
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || fail=1
          done < <(find . -name '*.mjs' -not -path './node_modules/*')
          exit $fail

      - name: Codex protocol tests (offline)
        run: node scripts/verify_codex_protocol.mjs

      - name: Session registry + parallel runners (offline)
        run: node scripts/verify_parallel.mjs b

      - name: Thread rollover (offline)
        run: node scripts/verify_rollover.mjs

      - name: Progress resume (offline)
        run: node scripts/verify_resume.mjs
